[project]
name = "payment-gateway-api"
version = "0.1.0"
description = "A small payment gateway for the Checkout.com engineering challenge"
authors = [{name = "Bhagyesh"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118.3,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.38,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.23,<1",
]

[tool.poetry]
requires-poetry = "==2.2.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"
pytest-asyncio = ">=1.2,<2"
ruff = ">=0.14,<1"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
